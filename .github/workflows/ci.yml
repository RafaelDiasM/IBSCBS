name: CI - Build & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Integration Tests (20/20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências (Raiz, Server e Client)
        run: npm run install:all

      - name: Compilar Frontend e Backend (Build)
        run: npm run build

      - name: Executar Bateria de Testes Fiscais da API (20 Testes)
        run: npm test
